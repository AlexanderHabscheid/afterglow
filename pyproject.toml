[project]
name = "afterglow"
version = "0.2.0"
description = "A post-date learning harness for Ditto-style matching systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.26,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
afterglow = "afterglow.cli:main"
afterglow-demo = "afterglow.cli:main"
afterglow-mcp = "afterglow.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
